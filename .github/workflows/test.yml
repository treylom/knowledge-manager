name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install-to-project contract
        run: bash scripts/tests/test_install_to_project.sh
      - name: installer signal and interrupted-retry contract
        run: python3 scripts/tests/test_install_signals.py
      - name: link gate
        run: bash scripts/tests/test_km_link_gate.sh
      - name: project-root save contract
        run: bash scripts/tests/verify-project-root-save-contract.sh
      - name: configure-vault-paths contract
        run: bash scripts/tests/test_configure_vault_paths.sh
      - name: zsh for the search block contracts (Claude Code runs blocks in the user's shell)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # verdict = sealed manifest outside the suites (cell ids + region hashes); the manifest sha256 is pinned in the
      # repository variable KM_TEST_MANIFEST_SEAL (repo settings, not in the tree) — set it when cells.manifest is resealed.
      - name: search Tier 0 memory-bank contract (sealed)
        run: python3 -I -B scripts/tests/seal_cells.py check scripts/tests/test_search_tier0_mb.sh
        env:
          KM_TEST_REQUIRE_SHELLS: bash zsh
          KM_TEST_REQUIRE_SEAL: "1"
          KM_TEST_MANIFEST_SEAL: ${{ vars.KM_TEST_MANIFEST_SEAL }}
      - name: search graph expansion contract (sealed)
        run: python3 -I -B scripts/tests/seal_cells.py check scripts/tests/test_search_graph_expansion.sh
        env:
          KM_TEST_REQUIRE_SHELLS: bash zsh
          KM_TEST_REQUIRE_SEAL: "1"
          KM_TEST_MANIFEST_SEAL: ${{ vars.KM_TEST_MANIFEST_SEAL }}
      - name: browser auto-detect contract (ego lite → Aside → fallback)
        run: python3 -I -B scripts/tests/test_km_browser_detect.py
      - name: note fragment boundary (2,500-char budget keeps a link that ends one char before it)
        run: python3 -I -B scripts/tests/test_km_note_fragment_boundary.py
      - name: same-vault note read stops safely where symlink-safe open is missing (Windows Python)
        run: python3 -I -B scripts/tests/test_km_note_guard_platform.py
      - name: command bodies carry no $0-$9 (Claude Code substitutes them with argument words)
        run: python3 -I -B scripts/tests/test_command_posargs.py
      - name: map descent — keyword route unchanged, ambiguity flags, bounded menus inside the vault
        run: python3 -I -B scripts/tests/test_km_map_descent.py
      - name: search rules route contract
        run: python3 -I -B scripts/tests/test_km_rules_route.py
      - name: km-tools pytest
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest agent-office/km-tools/tests -q
