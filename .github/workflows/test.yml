name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install-to-project contract
        run: bash scripts/tests/test_install_to_project.sh
      - name: installer signal and interrupted-retry contract
        run: python3 scripts/tests/test_install_signals.py
      - name: link gate
        run: bash scripts/tests/test_km_link_gate.sh
      - name: project-root save contract
        run: bash scripts/tests/verify-project-root-save-contract.sh
      - name: configure-vault-paths contract
        run: bash scripts/tests/test_configure_vault_paths.sh
      - name: zsh for the search block contracts (Claude Code runs blocks in the user's shell)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: search Tier 0 memory-bank contract
        run: bash scripts/tests/test_search_tier0_mb.sh
        env:
          KM_TEST_REQUIRE_SHELLS: bash zsh
      - name: search graph expansion contract
        run: bash scripts/tests/test_search_graph_expansion.sh
        env:
          KM_TEST_REQUIRE_SHELLS: bash zsh
      - name: search rules route contract
        run: python3 -I -B scripts/tests/test_km_rules_route.py
      - name: km-tools pytest
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest agent-office/km-tools/tests -q
